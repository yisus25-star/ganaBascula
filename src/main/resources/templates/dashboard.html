<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Integral Ganadera — Menú principal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
        }

        header {
            background: #1F3864;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }

        .header-left span { font-size: 20px; }
        .header-left h1 { font-size: 15px; font-weight: 600; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-name { color: #9FE1CB; font-size: 13px; }

        .btn-logout {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-logout:hover { background: rgba(255,255,255,0.1); }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .welcome {
            margin-bottom: 24px;
        }

        .welcome h2 { font-size: 20px; color: #1F3864; }
        .welcome p { font-size: 14px; color: #666; margin-top: 4px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .module-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .module-card.active {
            border-color: #0F6E56;
        }

        .module-card.active:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .module-card.inactive {
            opacity: 0.6;
            cursor: default;
        }

        .module-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 12px;
        }

        .module-card.active .module-icon { background: #e6f4ee; }
        .module-card.inactive .module-icon { background: #f0f4f8; }

        .module-card h3 { font-size: 14px; color: #1F3864; font-weight: 600; }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
        }

        .badge-active { background: #e6f4ee; color: #0F6E56; }
        .badge-soon { background: #f0f4f8; color: #888; }

        .module-full {
            grid-column: 1 / -1;
        }

        @media (max-width: 500px) {
            .grid { grid-template-columns: 1fr; }
            .module-full { grid-column: 1; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <span>🐄</span>
        <h1>Plataforma Integral Ganadera</h1>
    </div>
    <div class="header-right">
        <span class="user-name" id="userName"></span>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
</header>

<div class="container">
    <div class="welcome">
        <h2>Selecciona un módulo</h2>
        <p>Elige la funcionalidad que deseas usar</p>
    </div>

    <div class="grid">
        <div class="module-card active" onclick="window.location.href='/ventas'">
            <div class="module-icon">⚖️</div>
            <h3>Registro de ventas</h3>
            <span class="badge badge-active">Activo</span>
        </div>

        <div class="module-card inactive">
            <div class="module-icon">📋</div>
            <h3>Inventario propio</h3>
            <span class="badge badge-soon">Próximamente</span>
        </div>

        <div class="module-card inactive">
            <div class="module-icon">💰</div>
            <h3>Gastos de la finca</h3>
            <span class="badge badge-soon">Próximamente</span>
        </div>

        <div class="module-card inactive">
            <div class="module-icon">🛒</div>
            <h3>Compras de ganado</h3>
            <span class="badge badge-soon">Próximamente</span>
        </div>

        <div class="module-card inactive module-full">
            <div class="module-icon">📊</div>
            <h3>Reportes financieros</h3>
            <span class="badge badge-soon">Próximamente</span>
        </div>
    </div>
</div>

<script>
    // Verificar que el usuario esté autenticado
    const token = sessionStorage.getItem('token');
    const cedula = sessionStorage.getItem('cedula');

    if (!token) {
        window.location.href = '/login';
    }

    // Mostrar nombre del usuario
    document.getElementById('userName').textContent = cedula || 'Ganadero';

    function cerrarSesion() {
        sessionStorage.removeItem('token');
        sessionStorage.removeItem('cedula');
        window.location.href = '/login';
    }
</script>
</body>
</html>
